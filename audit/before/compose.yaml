# Comparison setup only. Use the root compose.yaml for the hardened service.
services:
  api:
    image: netsecure-api:before
    build:
      context: ../..
      dockerfile: audit/before/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 6
  nginx:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend:
  backend:
